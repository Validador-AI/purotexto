<script>
  // Le avisa a la página cuánto mide el anuncio, para que el espacio se ajuste solo.
  (function () {
    var ultimo = -1;
    function avisar() {
      var alto = Math.ceil(document.body.getBoundingClientRect().height);
      if (alto === ultimo) return;
      ultimo = alto;
      try { parent.postMessage({ tipo: 'pt-anuncio-alto', alto: alto }, '*'); } catch (e) {}
    }
    if (window.ResizeObserver) new ResizeObserver(avisar).observe(document.body);
    var veces = 0;
    var reloj = setInterval(function () { avisar(); if (++veces > 15) clearInterval(reloj); }, 1000);
    window.addEventListener('load', avisar);
  })();
</script>
</body>
